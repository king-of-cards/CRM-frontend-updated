<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
<link rel="icon" type="image/png" href="/Koc_Logo.jpg" />
<link rel="apple-touch-icon" href="/Koc_Logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d554e" />
    <script>
      // iPhone / iPad: stop Safari zooming in when a small text box or dropdown is tapped (and staying
      // zoomed). iOS still allows pinch-zoom with this; other phones never get it, so they are unaffected.
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        document
          .querySelector('meta[name="viewport"]')
          .setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover");
      }
    </script>
    <title>KOC_CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
